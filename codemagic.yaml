workflows:
  niyyah-checks:
    name: Niyyah checks
    instance_type: linux
    max_build_duration: 30
    environment:
      flutter: 3.47.2
    scripts:
      - name: Analyze and test
        script: |
          flutter analyze
          flutter test

  niyyah-ios:
    name: Niyyah iOS build
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: 3.47.2
      xcode: latest
    scripts:
      - name: Analyze and test
        script: |
          flutter analyze
          flutter test
      - name: Generate Xcode project
        script: |
          brew install xcodegen
          cd ios && xcodegen generate
      - name: Build iOS unsigned
        script: |
          flutter build ios --release --no-codesign
