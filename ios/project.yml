name: Runner
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
configs:
  Debug: debug
  Release: release
  Profile: release
configFiles:
  Debug: Flutter/Debug.xcconfig
  Release: Flutter/Release.xcconfig
  Profile: Flutter/Release.xcconfig
packages:
  FlutterGeneratedPluginSwiftPackage:
    path: Flutter/ephemeral/Packages/FlutterGeneratedPluginSwiftPackage
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "15.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    SUPPORTED_PLATFORMS: iphoneos
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    CODE_SIGN_STYLE: Automatic
    CURRENT_PROJECT_VERSION: $(FLUTTER_BUILD_NUMBER)
    VERSIONING_SYSTEM: apple-generic
targets:
  Runner:
    type: application
    platform: iOS
    sources:
      - Runner
      - path: NiyyahKit
        excludes:
          - "*.entitlements"
      - path: Flutter/AppFrameworkInfo.plist
        buildPhase: resources
    settings:
      base:
        INFOPLIST_FILE: Runner/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.example.niyyahApp
        PRODUCT_NAME: $(TARGET_NAME)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_BITCODE: NO
        LD_RUNPATH_SEARCH_PATHS:
          - $(inherited)
          - "@executable_path/Frameworks"
        SWIFT_OBJC_BRIDGING_HEADER: Runner/Runner-Bridging-Header.h
    entitlements:
      path: NiyyahKit/Shared.entitlements
    dependencies:
      - package: FlutterGeneratedPluginSwiftPackage
      - target: ShieldConfigExtension
      - target: ShieldActionExtension
      - target: DeviceActivityMonitorExtension
    preBuildScripts:
      - name: Run Script
        basedOnDependencyAnalysis: false
        script: /bin/sh "$FLUTTER_ROOT/packages/flutter_tools/bin/xcode_backend.sh" build
    postBuildScripts:
      - name: Thin Binary
        basedOnDependencyAnalysis: false
        script: /bin/sh "$FLUTTER_ROOT/packages/flutter_tools/bin/xcode_backend.sh" embed_and_thin
        inputFiles:
          - ${TARGET_BUILD_DIR}/${INFOPLIST_PATH}
  ShieldConfigExtension:
    type: app-extension
    platform: iOS
    sources:
      - ShieldConfigExtension
      - path: NiyyahKit
        excludes:
          - "*.entitlements"
      - path: ../assets/content/quran.json
        buildPhase: resources
      - path: ../assets/content/hadith.json
        buildPhase: resources
      - path: ../assets/fonts/Amiri-Regular.ttf
        buildPhase: resources
      - path: ../assets/fonts/Amiri-Bold.ttf
        buildPhase: resources
    settings:
      base:
        INFOPLIST_FILE: ShieldConfigExtension/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.example.niyyahApp.ShieldConfigExtension
        PRODUCT_NAME: $(TARGET_NAME)
        SKIP_INSTALL: YES
    entitlements:
      path: NiyyahKit/Shared.entitlements
  ShieldActionExtension:
    type: app-extension
    platform: iOS
    sources:
      - ShieldActionExtension
      - path: NiyyahKit
        excludes:
          - "*.entitlements"
    settings:
      base:
        INFOPLIST_FILE: ShieldActionExtension/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.example.niyyahApp.ShieldActionExtension
        PRODUCT_NAME: $(TARGET_NAME)
        SKIP_INSTALL: YES
    entitlements:
      path: NiyyahKit/Shared.entitlements
  DeviceActivityMonitorExtension:
    type: app-extension
    platform: iOS
    sources:
      - DeviceActivityMonitorExtension
      - path: NiyyahKit
        excludes:
          - "*.entitlements"
    settings:
      base:
        INFOPLIST_FILE: DeviceActivityMonitorExtension/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.example.niyyahApp.DeviceActivityMonitorExtension
        PRODUCT_NAME: $(TARGET_NAME)
        SKIP_INSTALL: YES
    entitlements:
      path: NiyyahKit/Shared.entitlements
schemes:
  Runner:
    build:
      targets:
        Runner: all
